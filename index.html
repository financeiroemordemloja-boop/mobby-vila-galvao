<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobby Vila Galvão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e15; --glass:rgba(14,19,29,.66); --glass2:rgba(255,255,255,.035); --glass3:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --text:#e8edf4; --muted:#93a0b5; --dim:#647086;
  --accent:#f2a273; --accent-d:#b4643f; --info:#7cc4ff;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --pend:#fb923c; --idle:#94a3b8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 15% -20%,#1b2638 0%,var(--bg) 60%);color:var(--text);
  font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* ---------- TOP BAR ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:rgba(9,13,20,.86);backdrop-filter:blur(14px);z-index:30;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:250px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#f6b48b,#b4643f);display:grid;place-items:center;
  box-shadow:0 6px 20px -6px rgba(242,162,115,.6)}
.logo svg{width:22px;height:22px}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--muted);font-weight:500}
.brand p{margin:1px 0 0;color:var(--dim);font-size:11.5px}
.kpis{display:flex;gap:10px;flex:1;min-width:0}
.kpi{flex:1;min-width:128px;padding:7px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass2);
  text-align:left;transition:background .15s,border-color .15s}
.kpi:hover{border-color:var(--line2);background:var(--glass3)}
.kpi .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px;font-weight:600}
.kpi .k i{width:7px;height:7px;border-radius:50%;display:inline-block}
.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:1px}
.kpi .s{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;width:310px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.search input{width:100%;padding:10px 12px 10px 36px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.05);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,162,115,.18)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(15,20,30,.97);border:1px solid var(--line2);border-radius:12px;
  padding:5px;display:none;max-height:360px;overflow:auto;box-shadow:0 20px 50px -10px rgba(0,0,0,.6);z-index:40}
.results.open{display:block}
.res{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.res:hover,.res.act{background:rgba(255,255,255,.07)}
.res b{min-width:56px;font-variant-numeric:tabular-nums}
.res .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .n small{color:var(--dim);display:block;font-size:11.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* ---------- SPLIT ---------- */
main.split{flex:1;display:grid;grid-template-columns:65% 35%;min-height:0}
.viewport{position:relative;min-height:0;overflow:hidden;background:#cfdbe6}
.viewport canvas{display:block}
.panel{border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(20,27,41,.9),rgba(11,15,23,.96));overflow:auto;min-height:0;position:relative}

/* overlays */
.ov{position:absolute;z-index:6;background:rgba(11,16,25,.66);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.toolbar{top:14px;left:14px;display:flex;gap:8px;background:none;border:0;box-shadow:none;backdrop-filter:none;flex-wrap:wrap;right:70px}
.seg{display:flex;padding:4px;gap:2px;background:rgba(11,16,25,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;backdrop-filter:blur(14px)}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:rgba(255,255,255,.12);color:#fff}
.seg button svg{width:15px;height:15px}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:240px;padding:6px;display:none;background:rgba(13,18,28,.95);border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 50px -10px rgba(0,0,0,.6)}
.dd.open .dd-menu{display:block}
.dd-menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px}
.dd-menu button:hover{background:rgba(255,255,255,.07)}
.dd-menu small{color:var(--dim);margin-left:auto;font-size:11px;padding-left:12px}
.dd-menu button{white-space:nowrap}
.dd-menu{min-width:300px}
.legend{left:14px;bottom:14px;padding:10px 12px;font-size:12px;min-width:200px}
.legend h4{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.legend .row{display:flex;align-items:center;gap:8px;padding:2px 0}
.legend .row span:last-child{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:12px}
.floors{right:14px;top:50%;transform:translateY(-50%);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;width:54px}
.floors .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.floors .val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1}
.floors input{writing-mode:vertical-lr;direction:rtl;height:220px;width:22px;accent-color:var(--accent);cursor:pointer}
.floors button{width:30px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center}
.floors button:hover{background:rgba(255,255,255,.12)}
.camctl{right:14px;bottom:14px;display:flex;padding:4px;gap:2px}
.camctl button{border:0;background:none;width:34px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.camctl button:hover{color:#fff;background:rgba(255,255,255,.08)}
.camctl button.on{color:var(--accent);background:rgba(242,162,115,.14)}
.camctl svg{width:17px;height:17px}
.tip{position:absolute;z-index:7;pointer-events:none;padding:7px 10px;font-size:12.5px;border-radius:9px;background:rgba(10,14,22,.9);border:1px solid var(--line2);
  white-space:nowrap;transform:translate(14px,14px);display:none}
.tip b{font-size:13px}.tip small{color:var(--muted);display:block}
.hint{position:absolute;left:50%;top:66px;transform:translateX(-50%);z-index:5;font-size:12px;color:#1c2633;background:rgba(255,255,255,.72);padding:6px 12px;border-radius:20px;backdrop-filter:blur(8px);transition:opacity .6s;pointer-events:none;white-space:nowrap}
.pin{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border-radius:20px;background:rgba(11,16,25,.78);
  border:1px solid rgba(255,255,255,.18);color:#fff;font:600 11.5px Inter,system-ui,sans-serif;white-space:nowrap;transform:translateY(-14px);transition:background .15s}
.pin:hover{background:rgba(242,162,115,.92);color:#1a0f08}
.pin i{width:16px;height:16px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:9px;color:#1a0f08}
.pin.street{background:rgba(255,255,255,.85);color:#222;border-color:transparent;pointer-events:none;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;padding:4px 10px}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:#0d131d;color:var(--muted);font-size:13px;transition:opacity .5s}
.loading .sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- PANEL ---------- */
.p-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.p-head h2{margin:2px 0 8px;font-size:26px;letter-spacing:-.03em;font-weight:700}
.p-head h2 small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#cfd7e3}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;margin-top:10px;
  background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;color:var(--muted)}
.x:hover{color:#fff;background:rgba(255,255,255,.1)}
.navu{position:absolute;right:52px;top:14px;display:flex;gap:4px}
.navu button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);display:grid;place-items:center}
.navu button:hover{color:#fff;background:rgba(255,255,255,.1)}
.tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(17,23,35,.96);backdrop-filter:blur(10px);z-index:3;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 8px 11px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:#fff;border-color:var(--accent)}
.tabs .cnt{font-size:10.5px;background:rgba(255,255,255,.1);padding:0 6px;border-radius:10px;font-weight:600}
.tabs .cnt.hot{background:rgba(248,113,113,.2);color:var(--bad)}
.body{padding:16px 20px 28px;display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--line);background:var(--glass2);border-radius:14px;padding:14px}
.card h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim)}
.person{display:flex;gap:12px;align-items:flex-start}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#10151f}
.person .nm{font-weight:600;font-size:14.5px}
.person .meta{color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:1px;margin-top:2px}
.person .meta a{color:var(--muted);text-decoration:none}.person .meta a:hover{color:var(--info)}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:#cdd5e1;white-space:nowrap}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li .grow{flex:1;min-width:0}
.li .sub{color:var(--dim);font-size:12px}
.li.clk{cursor:pointer;border-radius:8px}
.li.clk:hover .grow b{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.plate{display:inline-flex;flex-direction:column;align-items:center;border-radius:6px;overflow:hidden;border:2px solid #1d2a3a;background:#fff;color:#111;min-width:118px}
.plate span{background:#1a46a8;color:#fff;font-size:8px;font-weight:700;letter-spacing:.14em;width:100%;text-align:center;padding:1px 0}
.plate b{font:700 19px/1.25 "Courier New",monospace;letter-spacing:.08em;padding:1px 8px}
.big{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600;text-align:left;padding:0 0 7px}
td{padding:7px 0;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.06);font-weight:600;font-size:13px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:linear-gradient(135deg,#f6b48b,#e08a5b);border-color:transparent;color:#1a0f08}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn svg{width:15px;height:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:120px}
.fld input,.fld select,.fld textarea{padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--text);outline:none;font-size:13px}
.fld textarea{min-height:72px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text)}
.chk input{accent-color:var(--accent)}
.ticket{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(255,255,255,.025)}
.ticket .t1{display:flex;gap:8px;align-items:flex-start}
.ticket .t1 b{flex:1;font-size:13.5px}
.ticket .meta{font-size:11.5px;color:var(--dim);margin:3px 0 6px}
.ticket p{margin:0 0 8px;font-size:12.5px;color:#c3ccd9}
.notes{border-left:2px solid var(--line2);margin-left:4px;padding-left:12px;display:flex;flex-direction:column;gap:7px}
.note{font-size:12.5px;position:relative}
.note::before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--dim);border:2px solid #141a26}
.note.sind::before{background:var(--accent)}
.note small{color:var(--dim);display:block;font-size:11px}
.chart{width:100%;height:auto;display:block}
.chart text{font:600 9.5px Inter,system-ui,sans-serif;fill:#9aa6b8;text-anchor:middle}
.chart text.cl{fill:#6b778b;font-weight:500}
.chart .avg{stroke:#e8edf4;stroke-dasharray:4 4;stroke-width:1;opacity:.55}
.chart .axis{stroke:rgba(255,255,255,.12)}
.chart text.at{text-anchor:start;fill:#e8edf4;paint-order:stroke;stroke:#141b28;stroke-width:3px}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 10px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.empty{color:var(--dim);font-size:12.5px;padding:4px 0}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:10px;font-size:12.5px;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.alert b{color:var(--c)}
.linkbtn{background:none;border:0;color:var(--dim);font-size:12px;text-decoration:underline;padding:0}
.linkbtn:hover{color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:100;background:#f1f5f9;color:#0f172a;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 16px 40px -10px rgba(0,0,0,.5);transition:.25s;pointer-events:none;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:18px;height:18px;border-radius:50%;background:#10b981;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px}

@media (max-width:1280px){ .kpis{order:3;flex-basis:100%} .search{margin-left:auto} }
@media (max-width:900px){
  body{overflow:auto;height:auto;min-height:100%}
  main.split{grid-template-columns:1fr}
  .viewport{height:60vh;min-height:380px}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .kpis{flex-wrap:wrap}.kpi{min-width:calc(50% - 5px)}
  .search{width:100%;margin:0}
  .legend,.hint{display:none}
  .floors input{height:140px}
  .seg button span{display:none}
  .tabs{position:static}
}
</style>

</script>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1a0f08" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V5l6-2 6 2v16"/><path d="M3 21h18M10 8h1M13 8h1M10 12h1M13 12h1M10 16h1M13 16h1"/></svg></div>
    <div>
      <h1>Mobby Vila Galvão <span>· Gestão do Síndico</span></h1>
      <p>Av. São Bento, 1689 · Vila Galvão · Guarulhos – SP</p>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar apto (ex.: 84) ou morador…" autocomplete="off" aria-label="Buscar unidade ou morador">
    <div class="results" id="results"></div>
  </div>
</header>

<main class="split">
  <section class="viewport" id="viewport">
    <div class="loading" id="loading"><div><div class="sp"></div>Carregando gêmeo digital…</div></div>

    <div class="ov toolbar">
      <div class="seg" id="modes">
        <button data-mode="real" class="on" title="Visão Realista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Visão Realista</span></button>
        <button data-mode="fin" title="Mapa de Inadimplência"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Mapa de Inadimplência</span></button>
        <button data-mode="manut" title="Alertas de Manutenção"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span>Alertas de Manutenção</span></button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const money = v => BRL.format(v);
const MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const pad = (n, l = 2) => String(n).padStart(l, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const TODAY_ISO = iso(TODAY);
const fmtD = s => parseISO(s).toLocaleDateString('pt-BR');
const fmtDT = s => { const d = new Date(s); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); };
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const r2 = v => Math.round(v * 100) / 100;
const initials = n => n.split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const AVC = ['#f2a273','#7cc4ff','#a7f3d0','#fcd34d','#c4b5fd','#f9a8d4','#93c5fd','#fdba74'];
const avColor = n => AVC[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length];

function mulberry(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* =========================================================
   DADOS FICTÍCIOS (determinísticos)
   ========================================================= */
const FLOORS = 15, PER_FLOOR = 8;
const FN_F = ['Ana','Beatriz','Camila','Daniela','Fernanda','Gabriela','Helena','Isabela','Juliana','Larissa','Mariana','Natália','Patrícia','Renata','Sofia','Tatiane','Vanessa','Aline','Bruna','Carolina','Débora','Elaine','Flávia','Giovana','Jéssica','Luana','Priscila','Raquel','Simone','Viviane','Letícia','Marina'];
const FN_M = ['André','Bruno','Carlos','Diego','Eduardo','Felipe','Gustavo','Henrique','Igor','João','Lucas','Marcelo','Nicolas','Otávio','Paulo','Rafael','Rodrigo','Thiago','Vinícius','Wagner','Alexandre','Caio','Daniel','Fábio','Gabriel','Leandro','Mateus','Renan','Sérgio','Victor','Ricardo','Murilo'];
const LN = ['Silva','Santos','Oliveira','Souza','Rodrigues','Ferreira','Alves','Pereira','Lima','Gomes','Costa','Ribeiro','Martins','Carvalho','Almeida','Lopes','Soares','Fernandes','Vieira','Barbosa','Rocha','Dias','Nascimento','Andrade','Moreira','Nunes','Marques','Machado','Mendes','Freitas','Cardoso','Ramos','Teixeira','Araújo','Correia','Campos','Batista','Moura','Siqueira','Tavares','Prado','Galvão'];

const DOGS = ['Thor','Mel','Luna','Bob','Pipoca','Nina','Fred','Paçoca','Amora','Simba','Belinha','Zeca','Lola','Max','Cookie','Bento','Kiara','Toddy'];

const DOG_BREEDS = [['Shih-tzu','Pequeno'],['Golden Retriever','Grande'],['Spitz Alemão','Pequeno'],['Lhasa Apso','Pequeno'],['SRD','Médio'],['Yorkshire','Pequeno'],['Bulldog Francês','Pequeno'],['Poodle','Pequeno'],['Dachshund','Pequeno'],['Border Collie','Médio'],['Labrador','Grande']];
const CAT_BREEDS = ['SRD','Siamês','Persa','Maine Coon'];
const CARS = ['Hyundai HB20','Chevrolet Onix','Fiat Argo','VW Polo','Toyota Corolla','Honda Civic','Jeep Renegade','VW T-Cross','Fiat Mobi','Renault Kwid','Nissan Kicks','Toyota Yaris','Honda HR-V','Fiat Pulse','BYD Dolphin','Chevrolet Tracker','Fiat Strada'];
const COLORS_CAR = ['Prata','Branco','Preto','Cinza','Vermelho','Azul'];
const MANUT_CATS = ['Reforma','Envidraçamento de sacada','Vazamento','Infiltração','Elétrica'];
const TICKET_TPL = {
  'Envidraçamento de sacada': [
    ['Instalação de envidraçamento do terraço grill', 'Solicitação de instalação conforme padrão aprovado em assembleia (vidro incolor 8 mm, perfil branco). Aguardando agendamento da empresa instaladora.', 'Média'],

  'Vazamento': [

  'Infiltração': [

  'Elétrica': [
    ['Disjuntor do chuveiro desarmando', 'Morador relata queda do disjuntor ao ligar o chuveiro. Eletricista do condomínio fará medição no quadro.', 'Alta']],
  'Ruído': [
    ['Reclamação de ruído após 22h', 'Vizinho do andar de baixo relata barulho de móveis arrastados e salto alto após as 22h.', 'Baixa']],
  'Interfone': [
    ['Interfone sem áudio', 'Portaria não consegue falar com a unidade. Técnico da central de interfonia acionado.', 'Média']],
  'Portão/Garagem': [
    ['Controle do portão da garagem não funciona', 'Solicitado novo TAG veicular. Taxa de reposição de R$ 45,00 lançada no próximo boleto.', 'Baixa']],
  'Pet': [
    ['Latidos frequentes no período da tarde', 'Reclamação de vizinhos sobre latidos enquanto os tutores estão fora. Enviada orientação do regulamento interno.', 'Baixa']],
};
const RES_AREAS = {
  'Salão de Festas': { periodos: ['Tarde (12h–17h)','Noite (18h–23h)'], taxa: 180 },
  'Área Gourmet':    { periodos: ['Almoço (11h–16h)','Jantar (18h–23h)'], taxa: 90 },
  'Coworking':       { periodos: ['Manhã (08h–12h)','Tarde (13h–18h)','Noite (18h–22h)'], taxa: 0 },
  'Lavanderia':      { periodos: ['07h–09h','09h–11h','14h–16h','19h–21h'], taxa: 0 },
};

function generate() {
  const R = mulberry(1689);
  const pick = a => a[Math.floor(R() * a.length)];
  const chance = p => R() < p;
  const rint = (a, b) => a + Math.floor(R() * (b - a + 1));
  const slug = s => norm(s).replace(/[^a-z]/g, '');
  const L = () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[rint(0, 23)];
  const person = (g = chance(.5) ? 'f' : 'm', last) => {
    const fn = pick(g === 'f' ? FN_F : FN_M);
    const ln1 = last || pick(LN); const ln2 = chance(.55) ? ' ' + pick(LN) : '';
    const nome = `${fn} ${ln1}${ln2}`;
    return { nome, g, tel: `(11) 9${rint(4000, 9999)}-${rint(1000, 9999)}`,
      email: `${slug(fn)}.${slug((ln2 || ln1).trim())}${chance(.3) ? rint(1, 99) : ''}@${pick(DOMAINS)}` };
  };

  const idx = [...Array(FLOORS * PER_FLOOR).keys()];
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  { const k = idx.indexOf(59); [idx[k], idx[25]] = [idx[25], idx[k]]; } // Apto 84: unidade de exemplo com reforma em andamento
  const VAZIO = new Set(idx.slice(0, 8)), INAD = new Set(idx.slice(8, 22)), MANUT = new Set(idx.slice(22, 33));

  let vaga1 = 1, vaga2 = 1, ch = 1, pc = 1, rs = 1;
  const taken = new Set();
  const units = [];
  for (let f = 1; f <= FLOORS; f++) for (let p = 1; p <= PER_FLOOR; p++) {
    const i = (f - 1) * PER_FLOOR + (p - 1);
    const front = p <= 4, corner = [1, 4, 5, 8].includes(p);
    const area = corner ? (front ? 52 : 50) : (front ? 48 : 45);
    const vazio = VAZIO.has(i), inad = INAD.has(i), manut = MANUT.has(i);
    const owner = person();
    const tenant = !vazio && chance(.27) ? person() : null;
    const titular = tenant || owner;
    const residents = [];
    if (!vazio) {
      const n = rint(1, area >= 50 ? 5 : 4);
      residents.push({ nome: titular.nome, rel: tenant ? 'Inquilino(a) titular' : 'Proprietário(a)', idade: rint(26, 69) });
      const last = titular.nome.split(' ').slice(-1)[0];
      if (n >= 2) { const s = person(titular.g === 'f' ? 'm' : 'f', last); residents.push({ nome: s.nome, rel: 'Cônjuge', idade: rint(25, 66) }); }
      for (let k = 2; k < n; k++) { const c = person(undefined, last); residents.push({ nome: c.nome.split(' ')[0] + ' ' + last, rel: c.g === 'f' ? 'Filha' : 'Filho', idade: rint(1, 22) }); }
    }
    const pets = [];
    if (!vazio && chance(.38)) {
      for (let k = 0, n = chance(.25) ? 2 : 1; k < n; k++) {
        const dog = chance(.72); const br = dog ? pick(DOG_BREEDS) : [pick(CAT_BREEDS), 'Pequeno'];
        pets.push({ nome: dog ? pick(DOGS) : pick(CATS), especie: dog ? 'Cão' : 'Gato', raca: br[0], porte: br[1],
          petcare: chance(.86) ? `PC-${pad(pc++, 3)}` : null, vacina: iso(addDays(TODAY, rint(-70, 330))) });
      }
    }
    const vaga = front ? `G1-${pad(vaga1++, 3)}` : `G2-${pad(vaga2++, 3)}`;
    const vehicle = !vazio && chance(.74) ? { placa: `${L()}${L()}${L()}${rint(0,9)}${L()}${rint(0,9)}${rint(0,9)}`, modelo: pick(CARS), cor: pick(COLORS_CAR), ano: rint(2014, 2026) } : null;

    const base = vazio ? 0.3 : residents.length;
    const agua = [], gas = [];
    for (let k = 0; k < 6; k++) { agua.push(r2(Math.max(.4, base * 1.7 + (R() - .4) * 2.4))); gas.push(r2(Math.max(.2, base * .75 + (R() - .4) * 1.2))); }

    // boletos: competências M-5..M, vencimento dia 10 do mês seguinte
    const bills = [];
    for (let k = 5; k >= 0; k--) {
      const comp = new Date(TODAY.getFullYear(), TODAY.getMonth() - k, 1);
      const venc = new Date(comp.getFullYear(), comp.getMonth() + 1, 10);
      const j = 5 - k;
      const ordinaria = r2(area * 11.6), fundo = r2(ordinaria * .05), aguaV = r2(agua[j] * 13.4), gasV = r2(gas[j] * 9.2);
      bills.push({ comp: iso(comp), label: `${MES[comp.getMonth()]}/${String(comp.getFullYear()).slice(2)}`, venc: iso(venc),
        ordinaria, fundo, agua: aguaV, gas: gasV, valor: r2(ordinaria + fundo + aguaV + gasV), pagoEm: null });
    }
    const pastIdx = bills.map((b, j) => parseISO(b.venc) < TODAY ? j : -1).filter(j => j >= 0);
    const unpaid = new Set(inad ? pastIdx.slice(-rint(1, Math.min(4, pastIdx.length))) : []);
    bills.forEach((b, j) => {
      const v = parseISO(b.venc);
      if (v < TODAY) { if (!unpaid.has(j)) b.pagoEm = iso(chance(.08) ? addDays(v, rint(1, 9)) : addDays(v, -rint(0, 6))); }
      else if (!inad && chance(.28)) { const d = addDays(TODAY, -rint(0, 6)); b.pagoEm = iso(d > v ? v : d); }
    });

    const tickets = [];
    const mkT = (cat, status, daysAgo) => {
      const [titulo, desc, prio] = pick(TICKET_TPL[cat]);
      const aberto = addDays(TODAY, -daysAgo);
      const notas = [{ data: iso(aberto) + 'T09:30', autor: 'Portaria / Zeladoria', texto: 'Chamado registrado a pedido do morador.' }];
      if (status !== 'Aberto') notas.push({ data: iso(addDays(aberto, Math.max(1, Math.floor(daysAgo / 2)))) + 'T14:10', autor: 'Zeladoria', texto: status === 'Concluído' ? 'Serviço concluído e validado com o morador.' : 'Prestador visitou a unidade; serviço em execução.' });
      tickets.push({ id: `CH-${TODAY.getFullYear()}-${pad(ch++, 4)}`, titulo, categoria: cat, desc, prioridade: prio, status, aberto: iso(aberto), notas });
    };
    if (manut) mkT(pick(['Reforma','Envidraçamento de sacada','Envidraçamento de sacada','Vazamento','Infiltração','Elétrica','Reforma']), pick(['Aberto','Em andamento','Em andamento']), rint(1, 25));
    if (!vazio && chance(.34)) {
      if (chance(.6)) mkT(pick(Object.keys(TICKET_TPL)), 'Concluído', rint(20, 120));
      else mkT(pick(['Ruído','Interfone','Portão/Garagem','Pet']), pick(['Aberto','Em andamento']), rint(1, 30));
    }

    const reservas = [];
    if (!vazio && chance(.36)) {
      for (let k = 0, n = chance(.3) ? 2 : 1; k < n; k++) {
        const area_ = pick(['Salão de Festas','Área Gourmet','Área Gourmet','Coworking','Coworking','Lavanderia']);
        const per = pick(RES_AREAS[area_].periodos); const d = iso(addDays(TODAY, rint(-4, 28)));
        const key = `${area_}|${d}|${per}`; if (taken.has(key)) continue; taken.add(key);
        reservas.push({ id: `R-${pad(rs++, 4)}`, area: area_, data: d, periodo: per, convidados: area_.startsWith('Sal') ? rint(20, 60) : area_ === 'Área Gourmet' ? rint(6, 20) : 0,
          status: d < TODAY_ISO ? 'Realizada' : (RES_AREAS[area_].taxa && chance(.25) ? 'Aguardando pagamento' : 'Confirmada') });
      }
    }
    units.push({ id: `${f}${p}`, floor: f, pos: p, front, area, dorms: 2, suite: area >= 50, vazio, vazioMotivo: vazio ? pick(['À venda','Disponível para locação','Em transição de inquilino']) : null,
      owner, ownerReside: !vazio && !tenant, tenant, contratoAte: tenant ? iso(addDays(TODAY, rint(60, 700))) : null,
      residents, pets, vehicle, vaga, agua, gas, bills, tickets, reservas, boletos: [], light: .02 + R() * .12 });
  }
  // garante algumas reservas hoje
  const occ = units.filter(u => !u.vazio);
  const todayPlan = [['Área Gourmet','Jantar (18h–23h)'],['Coworking','Manhã (08h–12h)'],['Lavanderia','09h–11h'],['Salão de Festas','Noite (18h–23h)'],['Coworking','Tarde (13h–18h)']];
  todayPlan.forEach(([a, per], k) => {
    const key = `${a}|${TODAY_ISO}|${per}`; if (taken.has(key)) return; taken.add(key);
    const u = occ[(k * 23 + 7) % occ.length];
    u.reservas.push({ id: `R-${pad(rs++, 4)}`, area: a, data: TODAY_ISO, periodo: per, convidados: a.startsWith('Sal') ? 45 : a === 'Área Gourmet' ? 14 : 0, status: 'Confirmada' });
  });
  return units;
}

/* =========================================================
   ESTADO + PERSISTÊNCIA (log de eventos sobre a base gerada)
   ========================================================= */
const LS_KEY = 'mobby-vg-eventos-v1';
let events = [];
try { events = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { events = []; }
let units = generate();
let unitMap = Object.fromEntries(units.map(u => [u.id, u]));
function applyEvent(ev) {
  const u = unitMap[ev.unit]; if (!u) return;
  if (ev.t === 'note') { const t = u.tickets.find(x => x.id === ev.ticket); if (!t) return; if (ev.texto) t.notas.push({ data: ev.data, autor: 'Síndico', texto: ev.texto }); if (ev.status) t.status = ev.status; }
  else if (ev.t === 'ticket') u.tickets.unshift(JSON.parse(JSON.stringify(ev.ticket)));
  else if (ev.t === 'reserva') u.reservas.push({ ...ev.reserva });
  else if (ev.t === 'cancelReserva') { const r = u.reservas.find(x => x.id === ev.rid); if (r) r.status = 'Cancelada'; }
  else if (ev.t === 'boleto') u.boletos.push({ data: ev.data, comp: ev.comp, canais: ev.canais });
}
events.forEach(applyEvent);
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(events)); } catch {} }
function commit(ev) { events.push(ev); applyEvent(ev); save(); refreshAll(); }

/* ---------- derivados ---------- */
const billStatus = b => b.pagoEm ? 'Pago' : (parseISO(b.venc) < TODAY ? 'Atrasado' : 'Pendente');
const monthsLate = b => Math.max(1, Math.ceil((TODAY - parseISO(b.venc)) / (30 * 864e5)));
const billUpdated = b => r2(b.valor * (1.02 + .01 * monthsLate(b)));
function finStatus(u) { let late = false, pend = false; for (const b of u.bills) { const s = billStatus(b); if (s === 'Atrasado') late = true; else if (s === 'Pendente') pend = true; } return late ? 'Atrasado' : pend ? 'Pendente' : 'Pago'; }
const debt = u => r2(u.bills.filter(b => billStatus(b) === 'Atrasado').reduce((a, b) => a + billUpdated(b), 0));
const openTickets = u => u.tickets.filter(t => t.status !== 'Concluído');
function unitStatus(u) {
  if (u.vazio) return 'vazio';
  if (finStatus(u) === 'Atrasado') return 'inad';
  if (openTickets(u).some(t => MANUT_CATS.includes(t.categoria))) return 'manut';
  return 'ok';
}
const ST = {
  ok:    { label: 'Adimplente · Ocupado', c: '#34d399' },
  inad:  { label: 'Inadimplente',         c: '#f87171' },
  manut: { label: 'Manutenção / Reforma', c: '#fbbf24' },
  vazio: { label: 'Vazio',                c: '#94a3b8' },
};
const FIN_C = { Pago: '#34d399', Pendente: '#fb923c', Atrasado: '#f43f5e', Vazio: '#64748b' };
const TK_C = { 'Aberto': '#f87171', 'Em andamento': '#fbbf24', 'Concluído': '#34d399' };
const PR_C = { 'Alta': '#fb7185', 'Média': '#fbbf24', 'Baixa': '#93c5fd' };
const RS_C = { 'Confirmada': '#34d399', 'Aguardando pagamento': '#fb923c', 'Realizada': '#94a3b8', 'Cancelada': '#64748b' };
const allReservas = () => units.flatMap(u => u.reservas.map(r => ({ ...r, unit: u.id })));
const activeRes = u => u.reservas.filter(r => r.data >= TODAY_ISO && r.status !== 'Cancelada').sort((a, b) => a.data.localeCompare(b.data));
const floorName = f => f === 0 ? 'Térreo' : `${f}º andar`;

/* =========================================================
   ÁREAS COMUNS
   ========================================================= */

const q = $('#q'), results = $('#results'); let resIdx = 0, resList = [];
function search(term) {

  h += `<div class="card"><h3>Veículo e garagem<span class="r">Vaga ${u.vaga} · ${u.vaga.startsWith('G1') ? '1º' : '2º'} subsolo</span></h3>${u.vehicle ? `<div class="row" style="gap:14px"><div class="plate"><span>BRASIL</span><b>${u.vehicle.placa.slice(0, 3)}${u.vehicle.placa.slice(3)}</b></div><div><div style="font-weight:600">${u.vehicle.modelo}</div><div class="sub dim" style="font-size:12.5px">${u.vehicle.cor} · ${u.vehicle.ano} · TAG ativa</div></div></div>` : '<div class="empty">Nenhum veículo cadastrado — vaga livre.</div>'}</div>`;
  return h;
}

function tabFin(u) {
  const fs = finStatus(u), d = debt(u), last = u.bills[u.bills.length - 1];
  const open = u.bills.filter(b => !b.pagoEm);
  const next = u.bills.filter(b => billStatus(b) === 'Pendente').sort((a, b) => a.venc.localeCompare(b.venc))[0];
  const cMap = { Pago: 'var(--ok)', Pendente: 'var(--pend)', Atrasado: 'var(--bad)' };
  let h = `<div class="card"><h3>Taxa condominial<span class="r">Vencimento todo dia 10</span></h3>
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><span class="badge" style="--c:${cMap[fs]};font-size:12px">${fs === 'Pago' ? 'Pago · em dia' : fs}</span><div class="big" style="margin-top:6px;color:${fs === 'Atrasado' ? 'var(--bad)' : 'inherit'}">${fs === 'Atrasado' ? money(d) : money(next ? next.valor : last.valor)}</div>
      <div class="dim" style="font-size:12px">${fs === 'Atrasado' ? `em aberto · ${open.filter(b => billStatus(b) === 'Atrasado').length} boleto(s) vencido(s), com multa 2% + juros 1% a.m.` : next ? `próximo boleto · competência ${next.label} · vence ${fmtD(next.venc)}` : 'todos os boletos quitados'}</div></div>
    </div>
    ${fs === 'Atrasado' ? `<div class="alert" style="--c:var(--bad);margin-top:12px"><span>⚠</span><div><b>Unidade inadimplente.</b> Débito superior a ${monthsLate(open.find(b => billStatus(b) === 'Atrasado'))} mês(es). Avalie envio de notificação extrajudicial ou proposta de acordo.</div></div>` : ''}
  </div>`;
  h += `<div class="card"><h3>Últimos 6 meses</h3>${barChart(u.bills.map(b => b.valor), u.bills.map(b => b.label), u.bills.map(b => FIN_C[billStatus(b)]), { fmtV: v => 'R$ ' + Math.round(v) })}
    <table style="margin-top:8px"><thead><tr><th>Competência</th><th>Vencimento</th><th class="r">Valor</th><th class="r">Status</th></tr></thead><tbody>
    ${u.bills.slice().reverse().map(b => { const s = billStatus(b); const late = b.pagoEm && b.pagoEm > b.venc; return `<tr><td>${b.label}</td><td class="num">${fmtD(b.venc)}</td><td class="r num">${money(s === 'Atrasado' ? billUpdated(b) : b.valor)}</td><td class="r"><span class="badge" style="--c:${cMap[s]}">${s}${b.pagoEm ? ' ' + fmtD(b.pagoEm).slice(0, 5) : ''}${late ? ' · c/ atraso' : ''}</span></td></tr>`; }).join('')}
    </tbody></table></div>`;
  h += `<div class="card"><h3>Composição · ${last.label}</h3><table><tbody>
    <tr><td>Taxa ordinária (${u.area} m² × R$ 11,60)</td><td class="r num">${money(last.ordinaria)}</td></tr>
    <tr><td>Fundo de reserva (5%)</td><td class="r num">${money(last.fundo)}</td></tr>
    <tr><td>Água individualizada (${String(u.agua[5]).replace('.', ',')} m³)</td><td class="r num">${money(last.agua)}</td></tr>
    <tr><td>Gás individualizado (${String(u.gas[5]).replace('.', ',')} m³)</td><td class="r num">${money(last.gas)}</td></tr>
    <tr><td><b>Total</b></td><td class="r num"><b>${money(last.valor)}</b></td></tr></tbody></table></div>`;
  const destino = u.tenant || u.owner;
  h += `<div class="card"><h3>Boletos</h3>
    ${ui.boletoOpen ? `<form data-form="boleto" style="display:flex;flex-direction:column;gap:10px">

      <div class="row"><button class="btn pri" type="submit">Enviar 2ª via</button><button class="btn" type="button" data-act="boletoClose">Cancelar</button></div></form>`
      : `<div class="row"><button class="btn pri" data-act="boletoOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>Enviar 2ª via do boleto</button><button class="btn" data-act="copyLine">Copiar linha digitável</button></div>`}
    ${u.boletos.length ? `<div class="list" style="margin-top:12px">${u.boletos.slice().reverse().map(b => `<div class="li"><div class="grow"><b style="font-weight:600">2ª via enviada</b> <span class="sub">· competência ${u.bills.find(x => x.comp === b.comp)?.label || b.comp}</span><div class="sub">${b.canais.join(' + ')} · ${fmtDT(b.data)}</div></div><span class="badge" style="--c:var(--ok)">Enviado</span></div>`).join('')}</div>` : ''}

function tabRes(u) {
  const ar = activeRes(u), past = u.reservas.filter(r => r.data < TODAY_ISO || r.status === 'Cancelada');
  let h = `<div class="card"><h3>Reservas ativas<span class="r">${ar.length}</span></h3>${ar.length ? `<div class="list">${ar.map(r => `<div class="li"><div class="grow"><b style="font-weight:600">${r.area}</b>${r.data === TODAY_ISO ? ' <span class="badge" style="--c:var(--info)">Hoje</span>' : ''}<div class="sub">${fmtD(r.data)} · ${r.periodo}${r.convidados ? ` · ${r.convidados} convidados` : ''}</div></div><span class="badge" style="--c:${RS_C[r.status]}">${r.status}</span><button class="btn sm" data-act="cancelRes" data-rid="${r.id}" title="Cancelar reserva">✕</button></div>`).join('')}</div>` : '<div class="empty">Nenhuma reserva ativa.</div>'}
    ${past.length ? `<div class="dim" style="font-size:12px;margin-top:10px">Histórico: ${past.map(r => `${r.area} (${fmtD(r.data)}${r.status === 'Cancelada' ? ', cancelada' : ''})`).join(' · ')}</div>` : ''}
    ${u.vazio ? '' : ui.resOpen ? `<form data-form="res" style="display:flex;flex-direction:column;gap:10px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
      <div class="row"><label class="fld">Área<select name="area" data-act="areaSel">${Object.keys(RES_AREAS).map(a => `<option>${a}</option>`).join('')}</select></label>
      <label class="fld">Data<input type="date" name="data" min="${TODAY_ISO}" value="${TODAY_ISO}" required></label></div>
      <div class="row"><label class="fld">Período<select name="periodo"></select></label><label class="fld" style="max-width:120px">Convidados<input type="number" name="conv" min="0" max="60" value="0"></label></div>

    : `<div class="row" style="margin-top:12px"><button class="btn" data-act="resOpen">+ Nova reserva</button></div>`}

  const occ = units.filter(x => !x.vazio);

  const labels = u.bills.map(b => b.label.slice(0, 3));
  const fmt1 = v => v.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  const delta = (arr, avg) => { const p = (arr[5] / avg - 1) * 100; return `<span style="color:${p > 15 ? 'var(--bad)' : p < -15 ? 'var(--ok)' : 'var(--muted)'}">${p > 0 ? '+' : ''}${Math.round(p)}% vs. média</span>`; };
  h += `<div class="card"><h3>Água · leitura mensal (m³)<span class="r">${delta(u.agua, avgA)}</span></h3>${barChart(u.agua, labels, '#38bdf8', { fmtV: fmt1, avg: avgA, avgLabel: 'média ' + fmt1(avgA) })}</div>`;
  h += `<div class="card"><h3>Gás · leitura mensal (m³)<span class="r">${delta(u.gas, avgG)}</span></h3>${barChart(u.gas, labels, '#f2a273', { fmtV: fmt1, avg: avgG, avgLabel: 'média ' + fmt1(avgG) })}</div>`;
  return h;
}

  const hoje = allReservas().filter(r => r.data === TODAY_ISO && r.status !== 'Cancelada');

  return `<div class="p-head"><div class="eyebrow">Visão geral · ${TODAY.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })}</div><h2>Torre Única</h2>
    <div class="chips"><span class="chip">${FLOORS} andares</span><span class="chip">${PER_FLOOR} aptos por andar</span><span class="chip">${units.length} unidades</span><span class="chip">Plantas 45–52 m²</span><span class="chip">Portaria 24h</span></div></div>

      <div class="stack">${Object.entries(c).map(([k, n]) => `<div style="flex:${n};background:${ST[k].c}" title="${ST[k].label}: ${n}"></div>`).join('')}</div>
      <div class="grid2">${Object.entries(c).map(([k, n]) => `<div class="row" style="gap:8px;font-size:12.5px;flex-wrap:nowrap;white-space:nowrap"><span class="dot" style="background:${ST[k].c}"></span>${ST[k].label}<b class="num" style="margin-left:auto">${n}</b></div>`).join('')}</div>
      <div class="dim" style="font-size:12px;margin-top:10px">Clique em uma varanda no modelo 3D ou busque pelo número do apartamento.</div></div>
    <div class="grid2"><div class="card stat"><div class="k">Recebido no mês</div><div class="v">${money(recebido)}</div></div><div class="card stat"><div class="k">Pets cadastrados</div><div class="v">${units.reduce((a, u) => a + u.pets.length, 0)}</div></div></div>
    <div class="card"><h3>Maiores débitos<span class="r">${devedores.length} unidades</span></h3><div class="list">${devedores.slice(0, 6).map(u => `<div class="li clk" data-unit="${u.id}"><div class="grow"><b>Apto ${u.id}</b> <span class="sub">· ${esc((u.tenant || u.owner).nome)}</span><div class="sub">${u.bills.filter(b => billStatus(b) === 'Atrasado').length} boleto(s) em atraso</div></div><b class="num" style="color:var(--bad)">${money(debt(u))}</b></div>`).join('')}</div></div>
    <div class="card"><h3>Chamados em aberto<span class="r">${tks.length}</span></h3><div class="list">${tks.slice(0, 7).map(t => `<div class="li clk" data-unit="${t.unit}" data-tab2="oc"><span class="dot" style="background:${PR_C[t.prioridade]}"></span><div class="grow"><b style="font-weight:600">${esc(t.titulo)}</b><div class="sub">Apto ${t.unit} · ${t.status} · desde ${fmtD(t.aberto)}</div></div></div>`).join('')}</div></div>
    <div class="card" id="ovRes"><h3>Reservas de hoje<span class="r">${hoje.length}</span></h3>${hoje.length ? `<div class="list">${hoje.map(r => `<div class="li clk" data-unit="${r.unit}" data-tab2="reservas"><div class="grow"><b style="font-weight:600">${r.area}</b><div class="sub">${r.periodo}${r.convidados ? ` · ${r.convidados} convidados` : ''}</div></div><span class="tag">Apto ${r.unit}</span></div>`).join('')}</div>` : '<div class="empty">Nenhuma reserva para hoje.</div>'}</div>

}

/* ---------- eventos do painel ---------- */
panel.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; renderPanel(); return; }
  const lu = e.target.closest('[data-unit]'); if (lu) { if (lu.dataset.tab2) tab = lu.dataset.tab2; selectUnit(lu.dataset.unit, { fly: true }); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, u = view.kind === 'unit' ? unitMap[view.id] : null;
  if (act === 'close') closeToOverview();
  else if (act === 'nav' && u) { const f = u.floor + +a.dataset.d; if (f >= 1 && f <= FLOORS) selectUnit(`${f}${u.pos}`, { fly: true }); }
  else if (act === 'boletoOpen') { ui.boletoOpen = true; renderPanel(); }
  else if (act === 'boletoClose') { ui.boletoOpen = false; renderPanel(); }
  else if (act === 'resOpen') { ui.resOpen = true; renderPanel(); }
  else if (act === 'resClose') { ui.resOpen = false; renderPanel(); }
  else if (act === 'copyLine' && u) {
    const b = u.bills.find(x => !x.pagoEm) || u.bills[u.bills.length - 1];
    const digits = `03399.${u.id.padStart(5, '0')} 10689.${b.comp.replace(/-/g, '').slice(0, 6)}${pad(u.floor)}7 ${String(Math.round(b.valor * 100)).padStart(5, '0')}.10168 9 ${String(Math.round(b.valor * 100)).padStart(14, '0')}`;
    (navigator.clipboard?.writeText(digits) || Promise.reject()).then(() => toast('Linha digitável copiada'), () => toast(digits));
  }
  else if ((act === 'cancelRes' || act === 'reset') && !a.dataset.armed) {
    a.dataset.armed = '1'; const old = a.textContent;
    a.textContent = act === 'reset' ? 'Clique de novo para apagar anotações, reservas e envios' : 'Confirmar cancelamento';
    setTimeout(() => { if (a.isConnected) { delete a.dataset.armed; a.textContent = old; } }, 3500);
  }
  else if (act === 'cancelRes' && u) { commit({ t: 'cancelReserva', unit: u.id, rid: a.dataset.rid }); toast('Reserva cancelada'); }
  else if (act === 'reset') { { events = []; save(); units = generate(); unitMap = Object.fromEntries(units.map(x => [x.id, x])); closeToOverview(); refreshAll(); toast('Dados restaurados'); } }
});
panel.addEventListener('change', e => {
  if (e.target.dataset.act === 'ticketSel') { const nf = panel.querySelector('[data-newfields]'); nf.style.display = e.target.value === '__new' ? '' : 'none'; }
  if (e.target.dataset.act === 'areaSel') syncPeriodos();
});
panel.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, u = unitMap[view.id]; if (!u) return;
  const now = new Date().toISOString();
  if (f.dataset.form === 'boleto') {
    const canais = [f.email.checked && 'E-mail', f.whats.checked && 'WhatsApp'].filter(Boolean);
    if (!canais.length) return toast('Selecione ao menos um canal');
    ui.boletoOpen = false; commit({ t: 'boleto', unit: u.id, comp: f.comp.value, canais, data: now });
    toast(`2ª via enviada por ${canais.join(' e ')} para ${(u.tenant || u.owner).nome.split(' ')[0]}`);
  } else if (f.dataset.form === 'note') {
    const texto = f.texto.value.trim(), status = f.status.value;
    if (f.ticket.value === '__new') {
      const titulo = f.titulo.value.trim(); if (!titulo) return toast('Informe o título do chamado');
      const ticket = { id: `CH-${TODAY.getFullYear()}-N${Date.now().toString().slice(-5)}`, titulo, categoria: f.categoria.value, desc: texto || 'Chamado aberto pelo síndico.', prioridade: f.prioridade.value,
        status: status || 'Aberto', aberto: TODAY_ISO, notas: [{ data: now, autor: 'Síndico', texto: 'Chamado aberto pelo síndico.' }] };
      commit({ t: 'ticket', unit: u.id, ticket }); toast(`Chamado ${ticket.id} aberto`);
    } else {
      if (!texto && !status) return toast('Escreva uma anotação ou altere o status');
      commit({ t: 'note', unit: u.id, ticket: f.ticket.value, texto, status, data: now }); toast('Anotação registrada');
    }
  } else if (f.dataset.form === 'res') {
    const area = f.area.value, data = f.data.value, periodo = f.periodo.value;
    if (!data || data < TODAY_ISO) return toast('Escolha uma data a partir de hoje');
    const clash = allReservas().find(r => r.area === area && r.data === data && r.periodo === periodo && r.status !== 'Cancelada');
    if (clash) return toast(`Indisponível: já reservado pelo apto ${clash.unit}`);
    ui.resOpen = false;
    commit({ t: 'reserva', unit: u.id, reserva: { id: `R-N${Date.now().toString().slice(-6)}`, area, data, periodo, convidados: +f.conv.value || 0, status: RES_AREAS[area].taxa ? 'Aguardando pagamento' : 'Confirmada' } });
    toast(`Reserva de ${area} registrada para ${fmtD(data)}`);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && view.kind !== 'overview' && !e.target.closest('input,textarea,select')) closeToOverview();
  if (e.key === '/' && !e.target.closest('input,textarea,select')) { e.preventDefault(); q.focus(); }
});

renderKPIs(); applyMode(); renderPanel();
</script>
</body>
</html>
